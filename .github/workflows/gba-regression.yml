name: GBA port regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-host-regression:
    name: Public host regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python image dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run asset-independent host regressions
        run: sh tests/run_public_tests.sh

  stage-clear-arm-codegen:
    name: Isolated ARM7TDMI Stage Clear code generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang, LLD and LLVM binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Compile Stage Clear module and embedded LZ77 asset
        run: sh tests/run_public_arm_check.sh
      - name: Link synthetic-asset standalone GBA card viewer
        run: python3 tests/test_handheld_viewer_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage-clear-arm7tdmi-objects
          path: build-public-arm-check/*.o
          if-no-files-found: error
          retention-days: 14
